name: Test python package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        resolution: ['locked']
        include:
          - python-version: '3.11'
            resolution: 'lowest-direct'
          - python-version: '3.14'
            resolution: 'highest'
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: |
          case "${{ matrix.resolution }}" in
            locked)        uv sync --locked --group test --group dev ;;
            lowest-direct) uv sync --resolution lowest-direct --upgrade --group test --group dev ;;
            highest)       uv sync --resolution highest --upgrade --group test --group dev ;;
            *)             echo "::error::unknown resolution '${{ matrix.resolution }}'" && exit 1 ;;
          esac
      - name: License headers
        run: |
          uv run apache-license-check --copyright "2019-`date +%Y` SURF" oauth2_lib
      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files
      - name: Test with pytest
        run: |
          mkdir reports
          uv run pytest -vvv --cov-branch --cov-fail-under=80 --cov=oauth2_lib --cov-report=xml
