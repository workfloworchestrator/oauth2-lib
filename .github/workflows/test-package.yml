name: Test python package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  build:
    name: "Unit tests (Python ${{ matrix.python-version }}, ${{ matrix.resolution }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        resolution: ['locked']
        # Every include entry must spell out both keys. GitHub only merges an include
        # into an existing combination when it overwrites no original key; because
        # `resolution` is an original key, these rows create new combinations that
        # contain *only* the keys listed here. Omitting one would silently expand to
        # an empty string below.
        include:
          # Floor of the declared dependency ranges. lowest-direct stops at 3.12:
          # pydantic-core 2.1.2 (the pydantic>=2 floor) ships no 3.13+ wheel.
          - python-version: '3.11'
            resolution: 'lowest-direct'
          - python-version: '3.12'
            resolution: 'lowest-direct'
          # Ceiling: latest release of everything, on the two newest pythons.
          - python-version: '3.13'
            resolution: 'highest'
          - python-version: '3.14'
            resolution: 'highest'
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Pinned to the version that generated uv.lock, so `--locked` cannot
          # fail on an unrelated lockfile-format bump.
          version: "0.12.5"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        # The 'dev' group (pre-commit) is not needed here; linting runs in
        # run-linting-tests.yml. It is synced anyway as uv's default group.
        run: |
          case "${{ matrix.resolution }}" in
            locked)        uv sync --locked --group test ;;
            lowest-direct) uv sync --resolution lowest-direct --upgrade --group test ;;
            highest)       uv sync --resolution highest --upgrade --group test ;;
            *)             echo "::error::unknown resolution '${{ matrix.resolution }}'" && exit 1 ;;
          esac
      - name: Test with pytest
        # --no-sync: the non-locked resolutions deliberately deviate from uv.lock.
        run: uv run --no-sync pytest -vvv --cov-branch --cov-fail-under=80 --cov=oauth2_lib --cov-report=xml
