# Runs the pre-commit hooks (via prek) and the license header check. Both are independent of the
# python version -- most prek hooks build their own isolated environment -- so this
# does not need the python version matrix that test-package.yml uses.

name: Linting tests

# Invoked indirectly from (at the moment) ci.yml and scheduled-build.yml
on:
  workflow_call:

jobs:
  linting:
    name: Linting Tests
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: '3.13'
          enable-cache: true
      - name: Install dependencies
        # apache-license-check lives in the 'test' group; the 'dev' group is synced by default.
        run: uv sync --locked --group test
      - name: License headers
        run: uv run --no-sync apache-license-check --copyright "2019-`date +%Y` SURF" oauth2_lib
      - name: Check with mypy
        run: uv run --no-sync mypy oauth2_lib
      - name: Run prek hooks
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        env:
          SKIP: mypy
