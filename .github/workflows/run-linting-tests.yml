# Runs the pre-commit suite and the license header check. Both are independent of the
# python version -- most pre-commit hooks build their own isolated environment -- so this
# does not need the python version matrix that test-package.yml uses.

name: Linting tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  linting:
    name: Linting Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: '3.13'
          enable-cache: true
      - name: Install dependencies
        # apache-license-check lives in the 'test' group; the 'dev' group is synced by default.
        run: uv sync --locked --group test
      - name: License headers
        run: uv run --no-sync apache-license-check --copyright "2019-`date +%Y` SURF" oauth2_lib
      - name: Run pre-commit hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
