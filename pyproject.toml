[project]
name = "oauth2-lib"
version = "2.7.0"
description = "Authentication and authorization utilities for FastAPI applications."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "SURF", email = "automation-beheer@surf.nl" },
]
requires-python = ">=3.11,<3.15"
classifiers = [
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Typing :: Typed",
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "requests>=2.19.0",
    "structlog>=20.2.0",
    "fastapi>=0.90.1",
    "httpx[http2]>=0.23.0",
    "authlib>=1.6.6",
    "pydantic>=2",
    "pydantic-settings",
    "strawberry-graphql>=0.171.1",
    "asyncstdlib",
]

[project.urls]
Documentation = "https://workfloworchestrator.org/"
Homepage = "https://github.com/workfloworchestrator/oauth2-lib"

[dependency-groups]
test = [
    "apache-license-check",
    "black",
    "ruff",
    "mypy",
    "pygments",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-xdist",
    "requests_mock",
    "urllib3_mock==0.3.3",
]
dev = ["bumpversion", "pre-commit"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "oauth2_lib"
module-root = ""

[tool.isort]
profile = "black"
line_length = 120
skip = ["src", "venv"]

[tool.black]
line-length = 120
target-version = ["py311"]
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | venv
    | src
  )/
)
'''


[tool.nitpick]
style = "github://workfloworchestrator/nitpick-style@main/nitpick-style.toml"

[tool.ruff]
exclude = [
    ".git",
    ".cache",
    ".eggs",
    "__pycache__",
    "dist",
    "src",
    "crypt.py",
    "venv",
    "build",
    ".venv",
]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
ignore = [
    "B008",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "D202",
    "E501",
    "S101",
    "N806",
    "B904",
    "N802",
    "N801",
    "N818",
    "S113", # HTTPX has a default timeout
]
select = [
    "B",
    "C",
    "D",
    "E",
    "F",
    "I",
    "N",
    "RET",
    "S",
    "T",
    "W",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"


[tool.ruff.lint.pydocstyle]
convention = "google"
