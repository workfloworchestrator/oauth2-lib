[project]
name = "oauth2-lib"
version = "3.0.1"
description = "Authentication and authorization utilities for FastAPI applications."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "SURF", email = "automation-beheer@surf.nl" },
]
requires-python = ">=3.11,<3.15"
classifiers = [
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Typing :: Typed",
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.11",
]
# Floors are the oldest releases that CI's `uv sync --resolution lowest-direct` actually
# resolves on the supported pythons; anything lower is silently backtracked past and so is
# never tested. fastapi <0.100 pins pydantic<2, requests <2.26 caps idna<3, and asyncstdlib
# has no release before 3.9.0.
dependencies = [
    "requests>=2.26.0",
    "structlog>=20.2.0",
    "fastapi>=0.100.0",
    # httpx2 <2.1 has no Python 3.14 support and <2.4 misses several fixes. Capped at <3 because
    # 2.3.0 changed the default trust store in a minor release.
    "httpx2>=2.4,<3",
    "authlib>=1.6.6",
    "pydantic>=2",
    "pydantic-settings>=2.0.1",
    "strawberry-graphql>=0.171.1",
    "asyncstdlib>=3.9.0",
]

[project.urls]
Documentation = "https://workfloworchestrator.org/"
Homepage = "https://github.com/workfloworchestrator/oauth2-lib"

# Local dependencies for development.
# Lower bounds are required: CI runs `uv sync --resolution lowest-direct`, which
# would otherwise resolve unbounded entries to their oldest release on PyPI.
[dependency-groups]
test = [
    "apache-license-check>=1.0.0",
    "black>=24.10.0",
    # Only for starlette's TestClient in tests/strawberry. TestClient needs an HTTP client, and
    # prefers httpx2 from starlette 1.3.0 on -- but fastapi caps starlette until 0.135.0, so the
    # `lowest-direct` CI leg resolves fastapi 0.100.0 -> starlette 0.27, which imports httpx by name.
    # Drop this once the fastapi floor reaches 0.135.0; nothing else in the project uses httpx.
    "httpx>=0.23.0",
    "ruff>=0.15.11",
    "mypy==2.3.1",
    "pygments>=2.18.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.1",
    "requests_mock>=1.12.1",
    "urllib3_mock==0.3.3",
]
dev = ["pre-commit>=4.2.0"]

[build-system]
requires = ["uv_build>=0.10,<0.13"]
build-backend = "uv_build"

[tool.uv]
# Cooldown: don't resolve versions published in the last 3 days (supply-chain protection).
# Keep in sync with minimumReleaseAge in renovate.json.
exclude-newer = "3 days"

[tool.uv.build-backend]
module-name = "oauth2_lib"
module-root = ""
# Ship the test suite in the sdist so downstream packagers can run it from the tarball.
source-include = ["tests/**"]

[tool.black]
line-length = 120
target-version = ["py311"]
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | venv
    | src
  )/
)
'''

[tool.ruff]
exclude = [
    ".git",
    ".cache",
    ".eggs",
    "__pycache__",
    "dist",
    "src",
    "crypt.py",
    "venv",
    "build",
    ".venv",
]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
ignore = [
    "B008",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "D202",
    "E501",
    "S101",
    "N806",
    "B904",
    "N802",
    "N801",
    "N818",
    "S113", # HTTPX2 has a default timeout
]
select = [
    "B",
    "C",
    "D",
    "E",
    "F",
    "I",
    "N",
    "RET",
    "S",
    "T",
    "W",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"


[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.coverage.run]
source = ["oauth2_lib"]
omit = ["tests/*"]

[tool.pytest.ini_options]
addopts = "--doctest-modules --doctest-ignore-import-errors"
norecursedirs = [".git", "build", "dist", "*.egg", "__pycache__", ".cache", ".*", "migrations", "docs"]
testpaths = ["tests/"]
filterwarnings = [
    "ignore::DeprecationWarning:werkzeug",
    "ignore::DeprecationWarning:jinja2",
    "ignore::DeprecationWarning:jsonschema",
    "ignore::DeprecationWarning:yaml",
]

[tool.mypy]
plugins = ["pydantic.mypy", "strawberry.ext.mypy_plugin"]
ignore_missing_imports = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_no_return = true
warn_unreachable = true
implicit_reexport = false
strict_equality = true
show_error_codes = true
show_column_numbers = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_calls = false
disallow_untyped_defs = false
